<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Forhindrer søgemaskiner i at indeksere siden, så projektet ikke vises i søgeresultater -->
    <meta name="robots" content="noindex, nofollow">

     <!-- her henter vi vores font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/Css/css.css">

</head>

<body>

    <!-- Her er vores tilbage knap -->
    <a href="index.html" id="tilbageKnap" class="tilbageKnap">←</a>
    
    <!-- Her laver vi en oversigt over vores 3 fortællinger igennem cards-->
    <section id="personligSide">
        <h1> Peronlige Historier </h1>
        <p id="underTitel"> Vælg en historie og lyt med</p>
        <div id="cardContainer"></div>
    </section>

    <!-- Her laver vi vores videovisning, som først vises når der bliver valgt en video -->
    <section id="videoSide">
        <div id="videoInfo">
            <h2 id="videoNavn"> Navn </h2>
            <p id="videoDiagnose"></p>
        </div>

    <!-- Her samler vi vores video, knapper og undertekster i en container-->
        <div id="videoWrapper">
            <button id="lukVideo">✕</button>

            <!-- Her vises den vaægte video samt dens undertekst-spor-->
            <video id="historieVideo">
                    <track id="undertekstSpor" 
                     src="undertekster.vtt"
                    kind="subtitles" 
                    srclang="da" 
                    label="Dansk">
            </video>

            <!-- Her viser vi vores egne undertekster ovenpå videoen -->
            <p id="customUndertekst"></p>

            <!-- Her samler vi teksten og knappen til undertekster -->
            <div id="undertekstContainer">
            
            
                <!-- Her er knappen som tænder og slukker undertekster -->
                <button id="undertekstBtn" class="toggleBtn">
                    <span>CC</span>
                </button>
            
            </div>
            

            <div id="videoControls">
                <button id="playPauseBtn">▶</button>
                <input type="range" id="progressBar" min="0" max="100" value="0">
            </div>

         </div>

     </section>


    <script src="/js/personligehistorier.js"></script>
    
</body>
</html>
