<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Forhindrer søgemaskiner i at indeksere siden, så projektet ikke vises i søgeresultater -->
    <meta name="robots" content="noindex, nofollow">

     <!-- her henter vi vores font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/css.css">
</head>
<body>
    <!-- Her er vores tilbage knap -->
    <a href="index.html" class="tilbageKnap">←</a>
    <!-- Her er alle vores elementer til vores statistik quiz, som vi senere kan hente i vores JS -->
    <h1>Statistikker</h1>
    <section id="statistikSide">

        <div id="progressOmraade">
            <p id="sporgsmaalTekst">SPØRGSMÅL 1/3</p>

            <div id="progressBaggrund">
                <div id="progressFyld"></div>
            </div>
        </div>

        <div id="introBoks">
            <p>Her skal du gætte, hvor mange personer der passer på udsagnet. <br>
                Klik på det antal personer, du tror der passer og tryk videre.
            </p>
            <button id="startBtn">Start</button>
        </div>
        <div id="spilBoks" style="display: none;">
             <h2 id="sporgsmaal"> Smørgsmål </h2>
             <div id="personer"></div>

            <div id="badgeBoks" style="display: none;">
                <p>Tillykke du kan nu kalde dig statistikmester</p>
                <img src="/image/statistikmester.png" alt="Statistikmester badge">
             </div>

          <button id="videreBtn" style="display: none;"></button>

            <div id="statistikPopup" style="display: none;">
                <div id="statistikSvarIkon"></div>
                 <h2 id="statistikSvarOverskrift"> Svar </h2>
                 <p id="statistikPopupForklaring"></p>
                 <div id="popupPersoner"></div>

                 <button id="popupNaesteBtn">Næste spørgsmål →</button>
         </div>

    <div id="forklaringBoks" style="display: none;"></div>
    <p id="forklaring"></p>
</div>

    </section>
    






<script src="/js/statistikker.js"></script>
</body>
</html>
